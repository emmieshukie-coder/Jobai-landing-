<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobAI Landing</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .ad-container { margin: 20px 0; text-align: center; }
  </style>
</head>
<body>

  <h1>Latest Jobs</h1>
  <p>Find your next opportunity below</p>

  <!-- Ad Slot 2 -->
  <div class="ad-container">
    <iframe src="/ad-slot-2.html" width="100%" height="250" style="border:none;" loading="lazy"></iframe>
  </div>

  <div id="jobs">
  <p>Loading jobs...</p>
</div>

<script>
async function loadJobs() {
  try {
    const res = await fetch('/api/jobs');
    const jobs = await res.json();
    
    const jobsDiv = document.getElementById('jobs');
    if (!jobs || jobs.length === 0) {
      jobsDiv.innerHTML = '<p>No jobs found</p>';
      return;
    }
    
    jobsDiv.innerHTML = jobs.map(job => `
      <div style="border:1px solid #ddd; padding:15px; margin:10px 0; border-radius:8px;">
        <h3>${job.title}</h3>
        <p>${job.company} - ${job.location}</p>
        <a href="${job.link}" target="_blank">Apply</a>
      </div>
    `).join('');
    
  } catch (err) {
    document.getElementById('jobs').innerHTML = '<p>Failed to load jobs</p>';
  }
}

loadJobs();
      </script>

</body>
</html>
